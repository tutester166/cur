    // 解析内层StatusSave
    const status = JSON.parse(rawData.StatusSave);
    const elements = status.Elements;
    const wires = status.Wires;

    // 获取所有元件坐标 (x, z)  忽略y
    const positions = {};
    elements.forEach(elem => {
        const [x, y, z] = elem.Position.split(',').map(Number);
        positions[elem.Identifier] = { x, z };
    });

    // 计算坐标范围
    let xs = Object.values(positions).map(p => p.x);
    let zs = Object.values(positions).map(p => p.z);
    let xMin = Math.min(...xs), xMax = Math.max(...xs);
    let zMin = Math.min(...zs), zMax = Math.max(...zs);

    // 添加边距 (10%)
    let marginX = (xMax - xMin) * 0.1;
    let marginZ = (zMax - zMin) * 0.1;
    if (marginX === 0) marginX = 0.2;
    if (marginZ === 0) marginZ = 0.2;
    xMin -= marginX;
    xMax += marginX;
    zMin -= marginZ;
    zMax += marginZ;

    // 设置viewBox
    const viewBox = `${xMin} ${zMin} ${xMax - xMin} ${zMax - zMin}`;

    // 获取SVG元素
    const svg = document.getElementById('circuit');
    svg.setAttribute('viewBox', viewBox);

    // 定义缩写
    const abbrMap = {
        'Push Switch': 'PS',
        'Counter': 'Cnt',
        'Full Adder': 'FA',
        'No Gate': 'NOT',
        'Nor Gate': 'NOR',
        'Nimp Gate': 'NIMP',
        'And Gate': 'AND',
        'Relay Component': 'Relay',
        'Resistor': 'R',
        'Incandescent Lamp': 'Lamp',
        'Battery Source': 'Bat',
        'Simple Switch': 'SW',
        'Ground Component': 'GND'
    };

    // 绘制导线（蓝色）
    wires.forEach(wire => {
        const srcId = wire.Source;
        const tgtId = wire.Target;
        if (srcId === tgtId) return; // 忽略自连
        if (!positions[srcId] || !positions[tgtId]) return;

        const p1 = positions[srcId];
        const p2 = positions[tgtId];

        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', p1.x);
        line.setAttribute('y1', p1.z);
        line.setAttribute('x2', p2.x);
        line.setAttribute('y2', p2.z);
        line.setAttribute('stroke', 'blue');
        line.setAttribute('stroke-width', '0.02'); // 相对宽度
        line.setAttribute('opacity', '0.7');
        svg.appendChild(line);
    });

    // 绘制元件
    elements.forEach(elem => {
        const id = elem.Identifier;
        const pos = positions[id];
        if (!pos) return;

        const model = elem.ModelID;
        const label = elem.Label || '';
        const abbr = abbrMap[model] || model.substring(0,3);

        // 圆点
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', pos.x);
        circle.setAttribute('cy', pos.z);
        circle.setAttribute('r', '0.03'); // 半径
        circle.setAttribute('fill', 'gray');
        circle.setAttribute('stroke', 'black');
        circle.setAttribute('stroke-width', '0.005');
        svg.appendChild(circle);

        // 文本
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', pos.x + 0.04);
        text.setAttribute('y', pos.z - 0.04);
        text.setAttribute('font-size', '0.1');
        text.setAttribute('fill', 'black');
        text.textContent = abbr + (label ? `(${label})` : '');
        svg.appendChild(text);
    });
